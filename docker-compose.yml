services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: shoppilot-api
    ports:
      - "8000:8000"
    env_file:
      - ./services/api/.env.docker
    volumes:
      - ./services/api:/app
      - /app/.venv
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: shoppilot-web
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    restart: unless-stopped