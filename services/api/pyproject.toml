[project]
name = "api"
version = "0.1.0"
description = "ShopPilot AI API"
readme = "README.md"
authors = [
    { name = "tufail2005", email = "tufail1526@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
